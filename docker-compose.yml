services:

  mysql:

    image: mysql:8.0

    container_name: translation-app-mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

      MYSQL_DATABASE: ${MYSQL_DATABASE:-translation_app}

      MYSQL_USER: ${MYSQL_USER:-translation}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-translation}

    ports:

      - "${MYSQL_PORT:-3306}:3306"

    volumes:

      - mysql_data:/var/lib/mysql

      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

      - ./backend/src/main/resources/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

      - ./backend/src/main/resources/db/migration-im.sql:/docker-entrypoint-initdb.d/03-migration-im.sql:ro

    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    healthcheck:

      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]

      interval: 10s

      timeout: 5s

      retries: 5



  redis:

    image: redis:7-alpine

    container_name: translation-app-redis

    restart: unless-stopped

    ports:

      - "${REDIS_PORT:-6379}:6379"

    volumes:

      - redis_data:/data



  minio:

    image: minio/minio:latest

    container_name: translation-app-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:

      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}

      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    ports:

      - "${MINIO_PORT:-9000}:9000"

      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:

      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: translation-app-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing local/im-attachments;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

  coturn:

    image: coturn/coturn:latest

    container_name: translation-app-coturn

    restart: unless-stopped

    network_mode: host

    command:

      - -n

      - --log-file=stdout

      - --realm=translation-app

      - --listening-port=3478

      - --min-port=49152

      - --max-port=49252

      - --fingerprint

      - --lt-cred-mech

      - --user=imturn:imturnsecret



volumes:

  mysql_data:

  redis_data:

  minio_data:


